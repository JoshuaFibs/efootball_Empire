<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eFootball Empire</title>
<style>
:root{--bg:#0b1a12;--card:#13291c;--line:#21402e;--tx:#eaf5ee;--mu:#8fae9a;--gold:#f5c542;--g:#2fd36b;--y:#f5c542;--off:#5b6b61;--r:#ff6b6b;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f1f7f3;--card:#fff;--line:#cfe0d5;--tx:#10241a;--mu:#52695a;--gold:#b88700;--y:#c99a00;--off:#9aa8a0;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:560px;margin:0 auto;padding:14px}
.ban{border-radius:14px;overflow:hidden;text-align:center;background:linear-gradient(135deg,var(--card),var(--bg));border:1px solid var(--line)}
.ban img{display:block;width:100%}.ban h1{margin:0;padding:22px 14px;font-size:26px;color:var(--gold)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin:0 0 10px}
button,input{font:inherit;border-radius:10px}
input{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.b{border:0;padding:9px 14px;background:var(--gold);color:#1a1400;font-weight:700;cursor:pointer}
.b.s{background:transparent;color:var(--tx);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.n{flex:1;font-weight:600}.d{width:11px;height:11px;border-radius:50%;background:var(--off)}
.d.active{background:var(--g);box-shadow:0 0 8px var(--g)}.d.ingame{background:var(--y);box-shadow:0 0 8px var(--y)}
.tg{display:flex;align-items:center;gap:12px}.sw{width:62px;height:34px;border-radius:20px;background:var(--off);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.active{background:var(--g)}.sw.active::after,.sw.ingame::after{left:32px}.sw.ingame{background:var(--y);cursor:default}
.sc{display:flex;gap:10px;margin:10px 0}.sc input{text-align:center;font-size:24px}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--g)}.bad{color:var(--r)}a{color:var(--gold)}
</style></head><body><div class="w">
<div class="ban"><img src="banner.png" alt="eFootball Empire" onerror="this.outerHTML='<h1>🏆 eFootball Empire</h1>'"></div>
<div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your own values from Supabase > Project Settings > API
const SUPABASE_URL = "https://kjnfzqjvfxawsjkmvcwf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TgrbtUtfx6SLyM8DQOo6Fg_XcI8RG3y";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
let uid = null, players = [], matches = [], mode = "login", msg = "", started = false;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const live = p => Date.now() - new Date(p.last_seen) < 90000;
const st = p => (!live(p) || p.status === "off") ? "off" : p.status;
const label = {active:"Active", ingame:"In game", off:"Offline"};
const pl = id => players.find(p => p.id === id);
const me = () => pl(uid);
const open = () => matches.find(m => m.state === "pending" || m.state === "playing");

async function auth() {
  const email = document.getElementById("em").value.trim(), pw = document.getElementById("pw").value;
  msg = "";
  if (mode === "register") {
    const username = document.getElementById("un").value.trim();
    const { error } = await sb.auth.signUp({ email, password: pw, options: { data: { username } } });
    if (error) msg = error.message;
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) msg = error.message;
  }
  if (msg) render();
}
const flip = () => { mode = mode === "login" ? "register" : "login"; msg = ""; render(); };
const logout = async () => { await sb.rpc("set_status", { s: "off" }); await sb.auth.signOut(); };
const call = async (fn, args) => { const { error } = await sb.rpc(fn, args); if (error) alert(error.message); await load(); };
const toggle = () => { const m = me(); if (m.status !== "ingame") call("set_status", { s: st(m) === "active" ? "off" : "active" }); };
const challenge = id => call("challenge", { opp: id });
const respond = (m, accept) => call("respond", { m, accept });
async function submit(m) {
  const a = document.getElementById("a").value, b = document.getElementById("b").value;
  if (a === "" || b === "") return;
  await call("submit_score", { m, my_goals: +a, opp_goals: +b });
}
async function load() {
  const [p, m] = await Promise.all([
    sb.from("profiles").select("id,username,status,last_seen"),
    sb.from("matches").select("*").order("created_at", { ascending: false }).limit(30)
  ]);
  players = p.data || []; matches = m.data || [];
  render();
}
async function start(session) {
  uid = session.user.id; await load();
  if (started) return; started = true;
  sb.channel("empire").on("postgres_changes", { event: "*", schema: "public" }, load).subscribe();
  setInterval(() => { sb.rpc("heartbeat"); render(); }, 30000);
  addEventListener("pagehide", () => sb.rpc("set_status", { s: "off" }));
}
function render() {
  if (document.activeElement?.tagName === "INPUT") return;
  if (!uid) {
    const reg = mode === "register";
    app.innerHTML = `<div class="c"><h2>${reg ? "Join the Empire" : "Welcome back"}</h2>
      ${reg ? '<input id="un" placeholder="Username (3–20 characters)" maxlength="20">' : ""}
      <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)">
      <p class="bad">${esc(msg)}</p><button class="b" onclick="auth()">${reg ? "Create account" : "Log in"}</button>
      <p class="mu"><a href="#" onclick="flip();return false">${reg ? "I already have an account" : "New here? Register"}</a></p></div>`;
    return;
  }
  const mp = me(); if (!mp) { app.innerHTML = '<div class="c mu">Loading your profile…</div>'; return; }
  const s = st(mp), m = open();
  let h = `<div class="c"><h2>You: ${esc(mp.username)} · ${mp.coins} coins</h2><div class="tg">
    <button class="sw ${s}" onclick="toggle()" aria-label="Toggle status"></button>
    <div><b>${s === "active" ? "I’m active" : s === "ingame" ? "I’m in game" : "Offline"}</b>
    <div class="mu">${s === "ingame" ? "Switches back after your result" : "Tap the switch to appear in the lobby"}</div></div>
    <button class="b s" style="margin-left:auto" onclick="logout()">Log out</button></div></div>`;
  if (m && m.state === "pending") {
    const mine = m.p1 === uid, o = esc(pl(mine ? m.p2 : m.p1)?.username);
    h += `<div class="c"><h2>Challenge</h2>` + (mine
      ? `<p>Waiting for <b>${o}</b> to accept…</p><button class="b s" onclick="respond('${m.id}',false)">Cancel</button>`
      : `<p><b>${o}</b> wants to play you!</p><button class="b" onclick="respond('${m.id}',true)">Accept</button> <button class="b s" onclick="respond('${m.id}',false)">Decline</button>`) + `</div>`;
  } else if (m && m.state === "playing") {
    const o = esc(pl(m.p1 === uid ? m.p2 : m.p1)?.username);
    h += `<div class="c"><h2>Match in progress</h2><p>You vs <b>${o}</b></p>
      <p class="mu">Play your game, then enter the final score. Your opponent can’t see your entry until both are in.</p>
      <div class="sc"><div><div class="mu">Your goals</div><input id="a" type="number" min="0" max="99" inputmode="numeric"></div>
      <div><div class="mu">${o}’s goals</div><input id="b" type="number" min="0" max="99" inputmode="numeric"></div></div>
      <button class="b" onclick="submit('${m.id}')">Submit score</button></div>`;
  }
  const lob = players.filter(p => p.id !== uid && st(p) !== "off");
  h += `<div class="c"><h2>Lobby · ${lob.length} online</h2>` + (lob.length ? lob.map(p => {
    const x = st(p);
    return `<div class="row"><span class="d ${x}"></span><span class="n">${esc(p.username)}</span><span class="mu">${label[x]}</span>
      ${x === "active" && s === "active" && !m ? `<button class="b" onclick="challenge('${p.id}')">Let’s play</button>` : ""}</div>`;
  }).join("") : '<p class="mu">Nobody else is online yet. Share the link with your squad.</p>') + `</div>`;
  const rec = matches.filter(x => x.state === "confirmed" || x.state === "disputed").slice(0, 5);
  if (rec.length) h += `<div class="c"><h2>Recent matches</h2>` + rec.map(x => {
    const o = esc(pl(x.p1 === uid ? x.p2 : x.p1)?.username);
    const r = x.state === "disputed" ? ["bad", "Scores differ · disputed"] : !x.winner ? ["mu", "Draw"] : x.winner === uid ? ["ok", "Win"] : ["bad", "Loss"];
    return `<div class="row"><span class="n">vs ${o}</span><span class="${r[0]}">${r[1]}</span></div>`;
  }).join("") + `</div>`;
  app.innerHTML = h;
}
sb.auth.onAuthStateChange((_e, session) => { if (session) start(session); else { uid = null; render(); } });
sb.auth.getSession().then(({ data }) => { if (!data.session) render(); });
</script></body></html>
